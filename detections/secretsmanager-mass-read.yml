# Detection: many Secrets Manager secrets read in a short window.
# Schema: see detections/README.md

id: secretsmanager-mass-read
title: High volume of Secrets Manager secret reads
status: tested # draft -> tested (after the simulation fires it in a real account)
severity: high

attack:
  tactic: Credential Access
  technique_id: T1555.006
  technique: "Credentials from Password Stores: Cloud Secrets Management Stores"

simulation:
  tool: stratus-red-team
  technique: aws.credential-access.secretsmanager-retrieve-secrets

log_source: cloudtrail

# A COUNT rule. One GetSecretValue is normal (every app does it at start-up),
# so a single-event EventBridge pattern would be noise. The signal is volume
# from one window. Terraform turns this block into a CloudWatch Logs metric
# filter on the baseline trail's log group plus an alarm to the alert topic.
metric_filter:
  match: # every field must equal the value (CloudTrail record fields)
    eventSource: secretsmanager.amazonaws.com
    eventName: GetSecretValue
  threshold: 10 # reads ...
  period_seconds: 300 # ... within 5 minutes

expected_evidence: >
  CloudTrail events with eventSource secretsmanager.amazonaws.com and
  eventName GetSecretValue, many within minutes, usually preceded by
  ListSecrets from the same userIdentity.arn. requestParameters.secretId
  names each secret read. Failed reads (errorCode AccessDeniedException) are
  counted on purpose: an attacker probing for readable secrets is the same
  technique.

false_positives:
  - An application fleet scaling out or restarting at once, each instance
    reading its secrets at start-up. Tune the threshold above the largest
    normal deploy, or cache secrets in the app.
  - Secret rotation Lambdas, which read secrets in bursts during rotation.
  - The Stratus simulation itself (creates secrets, then reads each one).

response: notify # notify | contain

# Trade-off: the alarm says HOW MANY reads happened, not WHO. The responder
# pivots to CloudWatch Logs Insights on the trail log group (query in the
# README) to find the caller. Batch reads (BatchGetSecretValue) are not
# matched by this filter; whether they also log per-secret GetSecretValue
# events is unverified, so batch is listed as an open gap in the threat
# model until the batch Stratus technique is run.
