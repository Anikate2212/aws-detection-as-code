# Detection: EC2 instance role credentials used from outside the instance.
# Schema: see detections/README.md

id: ec2-instance-credential-exfiltration
title: EC2 instance credentials used outside the instance
status: draft # wiring verified with a GuardDuty sample finding 2026-11-26; live Stratus run skipped (NAT gateway cost)
severity: high

attack:
  tactic: Credential Access
  technique_id: T1552.005
  technique: "Unsecured Credentials: Cloud Instance Metadata API"

simulation:
  tool: stratus-red-team
  technique: aws.credential-access.ec2-steal-instance-credentials

log_source: guardduty

# GuardDuty (from the baseline) does the analysis: it knows which temporary
# credentials belong to which instance and flags their use from another
# network. This rule only routes that finding to the triage Lambda.
# OutsideAWS: used from a non-AWS IP (the Stratus case, from a laptop).
# InsideAWS: used from another AWS account's infrastructure.
event_pattern:
  source: ["aws.guardduty"]
  detail-type: ["GuardDuty Finding"]
  detail:
    type:
      - "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS"
      - "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS"

expected_evidence: >
  GuardDuty finding of type
  UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS.
  detail.resource.accessKeyDetails names the instance role session (principal
  ends in the instance ID) and the temporary access key. detail.service.action
  .awsApiCallAction shows the API called with it (sts:GetCallerIdentity or
  ec2:DescribeInstances in the simulation) and remoteIpDetails the caller's
  IP outside AWS. The matching CloudTrail events carry the same access key ID.

false_positives:
  - GuardDuty sample findings (create-sample-findings), which carry
    detail.service.additionalInfo.sample = true. Used on purpose to test the
    wiring; the alert shows them like real findings.
  - A developer copying instance role credentials to a laptop to debug. That
    is the technique itself, so the finding is correct; the fix is SSM
    sessions, not suppression.
  - The Stratus simulation itself.

response: notify # notify | contain

# Possible containment (not automated here): attach an inline deny on the
# instance role conditioned on aws:TokenIssueTime before now, which revokes
# every session issued so far, then rotate by restarting the instance. Not
# automated because it would also break the workload on the instance.
